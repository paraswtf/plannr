<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef0f3" />
    <title>Offline · Plannr</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Self-contained: this page is served when nothing else can be, so it
         links to no stylesheet, script or font that might not be there. */
      :root {
        --paper: #eef0f3;
        --surface: #fff;
        --title: #14171f;
        --muted: #5d6573;
        --accent: #3b5bdb;
        --hair: rgba(20, 23, 31, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--paper);
        color: var(--title);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow:
          0 0 0 1px var(--hair),
          0 8px 24px rgba(20, 23, 31, 0.06);
      }
      img {
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      a,
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 11px;
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        text-decoration: none;
      }
      button {
        border: 0;
        background: var(--accent);
        color: #fff;
      }
      a {
        color: var(--title);
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--hair);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/web-app-manifest-192x192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        This screen was not saved on your phone. Anything you opened before
        losing signal, like your schedule, is still there.
      </p>
      <div class="row">
        <a href="/schedule">Open my schedule</a>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
