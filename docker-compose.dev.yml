# Local development database. Port 5433 on the host so it never collides with
# an existing Postgres on the default 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: plannr-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plannr
    ports:
      - "5433:5432"
    volumes:
      - plannr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plannr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plannr-pgdata:
